name: optDNTRA-stable
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - cython
  - fastp=1.4.0
  - fastqc=0.13.0
  - cd-hit=4.8.1
  - transdecoder=6.0.0
  - blast=2.17.0
  - hmmer=3.4
  - seqtk=1.5
  - diamond=2.2.8
  - snakemake-minimal=9.27.1
  - samtools=1.21
  - bowtie2=2.5.5
  - salmon=1.10.3
  - pyyaml=6.0.3
  - requests=2.34.2
  - tqdm=4.70.1
  - coloredlogs=15.0.1
  - biopython=1.88
  - prettytable=3.18.0
  - pandas=2.3.3
  - pip=26.2.2
  # 1.23.x requires packaging>=26 but Snakemake 9.27.1 requires packaging<26.
  - snakemake-interface-common=1.22.0
  - trinity=2.15.2
  - rsem=1.3.3
  - bioconductor-edger=4.4.0
  - busco=6.1.0
  # OMArk 0.3.0 avoids newer releases' restrictive SQLite cap.
  - omark=0.3.0
